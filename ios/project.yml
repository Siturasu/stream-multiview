# XcodeGen 정의. `xcodegen generate`로 StreamMultiview.xcodeproj를 다시 만든다.
# 웹 자산(viewer.*, background.js, src/, content/)은 레포 루트를 그대로 참조하므로
# 확장 프로그램 파일을 고치면 앱에도 그대로 반영된다.
# Team ID는 Local.xcconfig에 둔다(재생성해도 유지).
name: StreamMultiview
options:
  bundleIdPrefix: dev.siturasu
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  StreamMultiview:
    type: application
    platform: iOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/ios-web
        type: folder
        buildPhase: resources
      - path: ../viewer.html
        buildPhase: resources
        group: web
      - path: ../viewer.css
        buildPhase: resources
        group: web
      - path: ../viewer.js
        buildPhase: resources
        group: web
      - path: ../background.js
        buildPhase: resources
        group: web
      - path: ../src
        type: folder
        buildPhase: resources
        group: web
      - path: ../content
        type: folder
        buildPhase: resources
        group: web
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Stream Multiview
        CFBundleName: Stream Multiview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # PiP 창이 백그라운드에서도 계속 돌게 한다.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.siturasu.stream-multiview
        PRODUCT_NAME: Stream Multiview
        # 타깃 레벨에 둬야 XcodeGen의 iOS 기본값(1,2)을 이긴다. 아이패드 전용.
        TARGETED_DEVICE_FAMILY: "2"
